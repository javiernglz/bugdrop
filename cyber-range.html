<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bugdrop Cyber Range — Split View</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
        }
        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #333;
        }
        .panel:last-child {
            border-right: none;
        }
        .header {
            background-color: #222;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .target-header {
            color: #ef4444;
        }
        .soc-header {
            color: #3b82f6;
        }
        iframe {
            flex: 1;
            border: none;
            width: 100%;
            height: 100%;
        }
        .badge {
            background: #333;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
        }
    </style>
</head>
<body>

    <!-- LEFT PANEL: TARGET (SHOP) -->
    <div class="panel">
        <div class="header target-header">
            <div>🔴 Red Team (Attacker)</div>
            <div class="badge">Target: localhost:5173</div>
        </div>
        <iframe src="http://localhost:5173" title="Bugdrop Shop"></iframe>
    </div>

    <!-- RIGHT PANEL: SOC (DEFENDER) -->
    <div class="panel">
        <div class="header soc-header">
            <div>🔵 Blue Team (Defender)</div>
            <div class="badge">SOC: localhost:5174</div>
        </div>
        <iframe src="http://localhost:5174" title="Bugdrop SOC"></iframe>
    </div>

</body>
</html>
