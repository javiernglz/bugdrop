services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - bugdrop-data:/data
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/data
      - SHOP_HOST=shop:8080
      - BOT_CHROMIUM_ARGS=--no-sandbox,--disable-dev-shm-usage
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

  shop:
    build: ./frontend-shop
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 50

  soc:
    build: ./frontend-soc
    ports:
      - "127.0.0.1:5174:8080"
    depends_on:
      backend:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 50

volumes:
  bugdrop-data:
