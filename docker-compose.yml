services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
    restart: unless-stopped

  shop:
    build: ./frontend-shop
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - BACKEND_URL=http://backend:3000
    depends_on:
      - backend
    restart: unless-stopped

  soc:
    build: ./frontend-soc
    ports:
      - "127.0.0.1:5174:5174"
    environment:
      - BACKEND_URL=http://backend:3000
    depends_on:
      - backend
    restart: unless-stopped
